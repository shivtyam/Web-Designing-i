<!DOCTYPE html>
<html>
<head>
  <title>Time Table</title>
  <style>
    table {
      border-collapse: collapse;
      text-align: center;
      width: 80%;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>
<body>

  <table>
    <!-- Main Header -->
    <tr>
      <th colspan="4">B-Tech - CSE</th>
    </tr>

    <!-- Time Slots Header -->
    <tr>
      <th>Day</th>
      <th>9 - 10 AM</th>
      <th>10 - 11 AM</th>
      <th>11 - 12 AM</th>
    </tr>

    <!-- Schedule Rows -->
    <tr>
      <td>Monday</td>
      <td>HTML</td>
      <td rowspan="2">HTML Lab</td>
      <td>Mathematics</td>
    </tr>
    <tr>
      <td>Tuesday</td>
      <td>CSS</td>
      <td>English</td>
    </tr>
    <tr>
      <td>Wednesday</td>
      <td>Java Script</td>
      <td>Mathematics</td>
      <td>Physics</td>
    </tr>

    <!-- Lecture Summary Section (Inside the Same Table) -->
    <tr>
      <th colspan="4">Lec Summary</th>
    </tr>
    <tr>
      <td colspan="2">HTML</td>
      <td colspan="2">Lecture 1</td>
    </tr>
    <tr>
      <td colspan="2">CSS</td>
      <td colspan="2">Lecture 1</td>
    </tr>
  </table>

</body>
</html>
